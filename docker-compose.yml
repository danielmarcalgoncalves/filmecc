
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tomhanks_app
    restart: unless-stopped
    ports:
      - "${RESERVED_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
      - DB_NAME=${DB_NAME:-filmes_db}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3000
    depends_on:
      - mariadb
      - auth-service

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: tomhanks_auth
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
      - DB_NAME=${DB_NAME:-filmes_db}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_HOST=${MAIL_HOST:-smtp-relay.brevo.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - APP_URL=${APP_URL}
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:10.11
    container_name: tomhanks_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-filmes_db}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"

volumes:
  mariadb_data:
