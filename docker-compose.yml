services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tomhanks_app
    restart: unless-stopped
    ports:
      - "${RESERVED_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
      - DB_NAME=${DB_NAME:-filmes_db}
      - JWT_SECRET=${JWT_SECRET:-XSfvtJaid8X39mPyO3i8iHE6cCrGZZYHJ_FM7KsfXRqJhtqj9tnYkZMv2uFkuOWV_2026}
      - AUTH_SERVICE_URL=http://auth-service:3000
      - LOG_SERVICE_URL=http://log-service:3000
      # MinIO — Object Storage para fotos de perfil
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-perfil-fotos}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
    depends_on:
      - mariadb
      - auth-service
      - log-service
      - minio

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: tomhanks_auth
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
      - DB_NAME=${DB_NAME:-filmes_db}
      - JWT_SECRET=${JWT_SECRET:-XSfvtJaid8X39mPyO3i8iHE6cCrGZZYHJ_FM7KsfXRqJhtqj9tnYkZMv2uFkuOWV_2026}
      - MAIL_HOST=${MAIL_HOST:-smtp-relay.brevo.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - APP_URL=${APP_URL}
      - LOG_SERVICE_URL=http://log-service:3000
    depends_on:
      - mariadb
      - log-service

  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    container_name: tomhanks_log
    restart: unless-stopped
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: tomhanks_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # MinIO — Object Storage S3-compatível para arquivos de usuário (fotos de perfil)
  # Console web: http://localhost:9001 | API S3: http://localhost:9000
  minio:
    image: minio/minio:latest
    container_name: tomhanks_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3 (usada pelo backend Node.js)
      - "9001:9001"   # Console web visual
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data

  mariadb:
    image: mariadb:10.11
    container_name: tomhanks_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-filmes_db}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"

volumes:
  mariadb_data:
  redis_data:
  minio_data:
